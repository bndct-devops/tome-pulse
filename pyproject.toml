[project]
name = "tome-pulse"
version = "0.1.0"
description = "The receiving end of Tome's opt-in telemetry: one small anonymous report per instance per month in, public aggregates out."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
